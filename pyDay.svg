<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 350" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&amp;display=swap');
      .txt-py { font-family: 'Montserrat', sans-serif; font-size: 82px; font-weight: 600; fill: #366994; }
      .txt-day { font-family: 'Montserrat', sans-serif; font-size: 82px; font-weight: 600; fill: #cfb154; }
      .txt-lp { font-family: 'Montserrat', sans-serif; font-size: 70px; font-weight: 400; fill: #5a646e; }
      .grid-line { stroke: #b0bec5; stroke-width: 1.5; stroke-linecap: round; opacity: 0.7; }
      .grid-diag { stroke: #78909c; stroke-width: 2; stroke-linecap: round; opacity: 0.85; }
      .net-node { fill: #37474f; opacity: 0.4; }
      .net-edge { stroke: #546e7a; stroke-width: 1.2; opacity: 0.35; }
    </style>

    <!-- Clip Path para el rombo del trazado de La Plata -->
    <clipPath id="square-city-clip">
      <rect x="50" y="50" width="220" height="220" rx="35" transform="rotate(45 160 160)" />
    </clipPath>
  </defs>

  <!-- ==================== ISOTIPO (Trazado Urbano + Python) ==================== -->
  <g transform="translate(20, 15)">
    <!-- Marco exterior del rombo de la ciudad -->
    <rect x="50" y="50" width="220" height="220" rx="35" transform="rotate(45 160 160)" 
          fill="#ffffff" stroke="#546e7a" stroke-width="4" />

    <!-- Cuadrícula interna / Diagonales de La Plata -->
    <g clip-path="url(#square-city-clip)">
      <!-- Calles ortogonales -->
      <line x1="60" y1="20" x2="60" y2="300" class="grid-line" />
      <line x1="95" y1="20" x2="95" y2="300" class="grid-line" />
      <line x1="130" y1="20" x2="130" y2="300" class="grid-line" />
      <line x1="160" y1="20" x2="160" y2="300" class="grid-line" stroke-width="2.5" />
      <line x1="190" y1="20" x2="190" y2="300" class="grid-line" />
      <line x1="225" y1="20" x2="225" y2="300" class="grid-line" />
      <line x1="260" y1="20" x2="260" y2="300" class="grid-line" />

      <line x1="20" y1="60" x2="300" y2="60" class="grid-line" />
      <line x1="20" y1="95" x2="300" y2="95" class="grid-line" />
      <line x1="20" y1="130" x2="300" y2="130" class="grid-line" />
      <line x1="20" y1="160" x2="300" y2="160" class="grid-line" stroke-width="2.5" />
      <line x1="20" y1="190" x2="300" y2="190" class="grid-line" />
      <line x1="20" y1="225" x2="300" y2="225" class="grid-line" />
      <line x1="20" y1="260" x2="300" y2="260" class="grid-line" />

      <!-- Diagonales -->
      <line x1="40" y1="40" x2="280" y2="280" class="grid-diag" />
      <line x1="40" y1="280" x2="280" y2="40" class="grid-diag" />

      <!-- Nodos de red / Plazas -->
      <line x1="95" y1="95" x2="160" y2="160" class="net-edge" />
      <line x1="225" y1="95" x2="160" y2="160" class="net-edge" />
      <line x1="95" y1="225" x2="160" y2="160" class="net-edge" />
      <line x1="225" y1="225" x2="160" y2="160" class="net-edge" />

      <circle cx="160" cy="160" r="7" class="net-node" />
      <circle cx="95" cy="95" r="5" class="net-node" />
      <circle cx="225" cy="95" r="5" class="net-node" />
      <circle cx="95" cy="225" r="5" class="net-node" />
      <circle cx="225" cy="225" r="5" class="net-node" />
    </g>

    <!-- Líneas de cota exteriores -->
    <line x1="30" y1="160" x2="290" y2="160" stroke="#90a4ae" stroke-width="1" stroke-dasharray="4 3" opacity="0.6" />
    <line x1="160" y1="30" x2="160" y2="290" stroke="#90a4ae" stroke-width="1" stroke-dasharray="4 3" opacity="0.6" />

    <!-- Serpiente Azul Python -->
    <path d="M 155,70 
             C 110,70 115,90 115,90 
             L 115,110 
             L 160,110 
             L 160,125 
             L 90,125 
             C 90,125 70,123 70,165 
             C 70,205 88,202 88,202 
             L 102,202 
             L 102,185 
             C 102,185 101,162 125,162 
             L 170,162 
             C 170,162 195,163 195,138 
             L 195,95 
             C 195,95 198,70 155,70 Z" 
          fill="#81bde3" fill-opacity="0.88" stroke="#1e2a38" stroke-width="6" stroke-linejoin="round" />
    <circle cx="138" cy="90" r="6" fill="#ffffff" stroke="#1e2a38" stroke-width="4" />
    <!-- Brillo sutil azul -->
    <path d="M 125,78 C 145,76 175,78 182,95" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6" />

    <!-- Serpiente Amarilla Python -->
    <path d="M 165,250 
             C 210,250 205,230 205,230 
             L 205,210 
             L 160,210 
             L 160,195 
             L 230,195 
             C 230,195 250,197 250,155 
             C 250,115 232,118 232,118 
             L 218,118 
             L 218,135 
             C 218,135 219,158 195,158 
             L 150,158 
             C 150,158 125,157 125,182 
             L 125,225 
             C 125,225 122,250 165,250 Z" 
          fill="#f2c852" fill-opacity="0.88" stroke="#1e2a38" stroke-width="6" stroke-linejoin="round" />
    <circle cx="182" cy="230" r="6" fill="#ffffff" stroke="#1e2a38" stroke-width="4" />
    <!-- Brillo sutil amarillo -->
    <path d="M 195,242 C 175,244 145,242 138,225" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- ==================== TIPOGRAFÍA ==================== -->
  <g transform="translate(345, 140)">
    <text x="0" y="0">
      <tspan class="txt-py">py</tspan><tspan class="txt-day">Day</tspan>
    </text>
    <text x="0" y="70" class="txt-lp">La Plata</text>
  </g>
</svg>
